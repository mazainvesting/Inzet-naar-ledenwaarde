name: Controleer Ledenwaarde
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types scripts/check-model.mjs
      - run: node --experimental-strip-types scripts/check-sources.mjs
      - run: node --experimental-strip-types scripts/check-dashboard.mjs
      - run: npm run build
      - run: node --experimental-strip-types scripts/check-api.mjs
